name: Bug report
description: Use this template for reporting bugs.
labels:
  - 'kind/bug'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

        Questions about how to use act belong in [GitHub Discussions](https://github.com/nektos/act/discussions/new/choose). The user guide is at [nektosact.com](https://nektosact.com).
  - type: checkboxes
    id: searched
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions and did not find this report.
          required: true
  - type: input
    id: act-version
    attributes:
      label: Act version
      description: |
        Output of `act --version`. If you built from source, include the commit.
      placeholder: |
        act version 0.2.89
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: |
        The OS you ran act on, for example Ubuntu 24.04, macOS 15, or Windows 11.
      placeholder: |
        Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: docker-engine
    attributes:
      label: Docker Engine
      description: |
        Server version from `docker version`, or the Docker Engine section of `act --bug-report`. If you use Podman or another runtime, name it and its version. Use `n/a` for a host run without a container engine.
      placeholder: |
        Docker Engine 28.0.4
    validations:
      required: true
  - type: textarea
    id: act-command
    attributes:
      label: Command used with act
      description: |
        Paste the whole command.
      placeholder: |
        act -P ubuntu-latest=node:16-buster-slim -v
      render: sh
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow snippet
      description: |
        Paste the workflow, or the jobs that reproduce the bug. Redact secrets.
      placeholder: |
        name: My workflow
        on: [push]
        jobs:
          test:
            runs-on: ubuntu-latest
            steps:
              - run: echo hello
      render: yml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: |
        What did you expect act to do?
      placeholder: |
        The job runs and exits 0.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: |
        What happened instead?
      placeholder: |
        The job fails with this error.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Full `act -v` log
      description: |
        Paste the full verbose log from `act -v`. If it is too large for the issue form, paste the section that shows the failure here and attach the full log to the issue. Redact tokens, passwords, and other secrets.
      render: sh
      placeholder: |
        act -v
    validations:
      required: true
  - type: textarea
    id: act-debug
    attributes:
      label: Output of `act --bug-report`
      description: |
        This adds the host, Docker socket, config, and build details that the fields above do not capture.
      render: plain text
      placeholder: |
        act --bug-report
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Link to GitHub repository
      description: |
        A link helps us reproduce the problem. Skip this if the repository is private or is not on GitHub.
      placeholder: |
        https://github.com/nektos/act
    validations:
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      placeholder: |
        Anything else that does not fit above.
    validations:
      required: false
