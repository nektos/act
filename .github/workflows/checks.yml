name: checks
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  ACT_OWNER: ${{ github.repository_owner }}
  ACT_REPOSITORY: ${{ github.repository }}
  CGO_ENABLED: 0

jobs:
  # Docs-only pull requests skip test-linux, test-host, and snapshot.
  # Those jobs still run and pass so required check names stay in place.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect non-doc changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "Could not resolve pull request commits; running heavy jobs"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"; then
            echo "git diff failed; running heavy jobs"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$files" ]; then
            echo "No changed files detected; running heavy jobs"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heavy=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|*.markdown|*.png|*.gif|*.svg|*.jpg|*.jpeg|docs/*|LICENSE*|CODE_OF_CONDUCT*|.github/ISSUE_TEMPLATE/*|.github/DISCUSSION_TEMPLATE/*)
                ;;
              *)
                heavy=true
                break
                ;;
            esac
          done < <(printf '%s\n' "$files")
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4
      - uses: megalinter/megalinter/flavors/go@ec124f7998718d79379a3c5b39f5359952baf21d # v8.4.2
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: false
          # Results stay in the job log. Status and comment reporters need write scopes.
          GITHUB_STATUS_REPORTER: false
          GITHUB_COMMENT_REPORTER: false

  # Matrix legs run in parallel. The aggregate job below is named test-linux so the
  # existing required check keeps working. ci-success needs that aggregate.
  test-linux-shard:
    name: test-linux (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1', '2', '3']
    env:
      ACT_TEST_LINUX_SHARD: ${{ matrix.shard }}/4
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.heavy != 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "Documentation-only change; skipping test-linux shard ${SHARD}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.changes.outputs.heavy == 'true'
        with:
          fetch-depth: 2
          persist-credentials: false
      # QEMU is only required for TestRunDifferentArchitecture, pinned to shard 0.
      - name: Set up QEMU
        if: needs.changes.outputs.heavy == 'true' && matrix.shard == '0'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      # Shell steps do not receive the Actions cache token. This action re-exports
      # ACTIONS_RUNTIME_TOKEN and ACTIONS_CACHE_URL / ACTIONS_RESULTS_URL for buildx.
      - name: Expose GitHub Actions runtime
        if: needs.changes.outputs.heavy == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Set up Docker Buildx
        if: needs.changes.outputs.heavy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache fixture images
        if: needs.changes.outputs.heavy == 'true'
        run: .github/ci/cache-fixtures.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: needs.changes.outputs.heavy == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The runtime action exports ACTIONS_RUNTIME_URL for every later step.
      # act treats that as the artifact server, so tests must not see it.
      - name: Hide artifact runtime from tests
        if: needs.changes.outputs.heavy == 'true'
        run: |
          {
            echo "ACTIONS_RUNTIME_URL="
            echo "ACTIONS_RUNTIME_TOKEN="
          } >> "$GITHUB_ENV"
      - name: Run tests
        if: needs.changes.outputs.heavy == 'true'
        run: .github/ci/run-linux-tests.sh
      - name: Test Summary
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2.4
        with:
          paths: unit-tests.xml
        if: always() && needs.changes.outputs.heavy == 'true'
      - name: Run act from cli
        if: needs.changes.outputs.heavy == 'true' && matrix.shard == '0'
        run: go run main.go -P ubuntu-latest=node:24-bookworm-slim -C ./pkg/runner/testdata/ -W ./basic/push.yml
      - name: Run act from cli without docker support
        if: needs.changes.outputs.heavy == 'true' && matrix.shard == '0'
        run: go run -tags WITHOUT_DOCKER main.go -P ubuntu-latest=-self-hosted -C ./pkg/runner/testdata/ -W ./local-action-js/push.yml
      - name: Upload Codecov report
        if: needs.changes.outputs.heavy == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.txt
          flags: linux-${{ matrix.shard }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test timing
        if: always() && needs.changes.outputs.heavy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-linux-timing-${{ matrix.shard }}
          path: timing.json
          if-no-files-found: warn

  # Named test-linux so an existing required check still sees one result.
  # Fails unless every shard succeeded.
  test-linux:
    name: test-linux
    needs: test-linux-shard
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every shard
        env:
          RESULT: ${{ needs.test-linux-shard.result }}
        run: |
          set -euo pipefail
          echo "test-linux-shard result: ${RESULT}"
          test "${RESULT}" = "success"

  test-host:
    needs: changes
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
    name: test-host-${{matrix.os}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.heavy != 'true'
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        shell: bash
        run: echo "Documentation-only change; skipping host tests for ${RUNNER_LABEL}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.changes.outputs.heavy == 'true'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: needs.changes.outputs.heavy == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run Tests
        if: needs.changes.outputs.heavy == 'true'
        # --packages is required by gotestsum when --rerun-fails is set.
        run: |
          go run gotest.tools/gotestsum@v1.13.0 \
            --rerun-fails=2 \
            --junitfile unit-tests.xml \
            --format pkgname \
            --packages=./... \
            -- -v -cover -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic -timeout 20m -run '^TestRunEventHostEnvironment$'
        shell: bash
      - name: Test Summary
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2.4
        with:
          paths: 'unit-tests.xml'
        if: always() && needs.changes.outputs.heavy == 'true'

  snapshot:
    name: snapshot
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; skipping snapshot"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.changes.outputs.heavy == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: needs.changes.outputs.heavy == 'true'
        with:
          go-version-file: go.mod
          # Publishing the snapshot from a cached module download is what
          # zizmor flags as cache poisoning. Tests above still use the cache.
          cache: false
      - name: GoReleaser
        if: needs.changes.outputs.heavy == 'true'
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - name: Capture x86_64 (64-bit) Linux binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-linux-amd64
          path: dist/act_linux_amd64_v1/act
      - name: Capture i386 (32-bit) Linux binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-linux-i386
          path: dist/act_linux_386/act
      - name: Capture arm64 (64-bit) Linux binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-linux-arm64
          path: dist/act_linux_arm64/act
      - name: Capture armv6 (32-bit) Linux binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-linux-armv6
          path: dist/act_linux_arm_6/act
      - name: Capture armv7 (32-bit) Linux binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-linux-armv7
          path: dist/act_linux_arm_7/act
      - name: Capture riscv64 (64-bit) Linux binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-linux-riscv64
          path: dist/act_linux_riscv64/act
      - name: Capture x86_64 (64-bit) Windows binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-windows-amd64
          path: dist/act_windows_amd64_v1/act.exe
      - name: Capture i386 (32-bit) Windows binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-windows-i386
          path: dist/act_windows_386/act.exe
      - name: Capture arm64 (64-bit) Windows binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-windows-arm64
          path: dist/act_windows_arm64/act.exe
      - name: Capture armv7 (32-bit) Windows binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-windows-armv7
          path: dist/act_windows_arm_7/act.exe
      - name: Capture x86_64 (64-bit) MacOS binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-macos-amd64
          path: dist/act_darwin_amd64_v1/act
      - name: Capture arm64 (64-bit) MacOS binary
        if: ${{ needs.changes.outputs.heavy == 'true' && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: act-macos-arm64
          path: dist/act_darwin_arm64/act
      - name: Chocolatey
        if: needs.changes.outputs.heavy == 'true'
        uses: ./.github/actions/choco # zizmor: ignore[self-repository]
        with:
          version: v0.0.0-pr

  ci-success:
    name: ci-success
    needs: [changes, lint, test-linux, test-host, snapshot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Fail if a required job failed or was cancelled
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = []
          for name in sorted(needs):
              result = needs[name].get("result")
              print(f"{name}={result}")
              # skipped is success for path-filtered jobs
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("failed or cancelled: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PY
