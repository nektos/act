name: release
on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Winget
        uses: vedantmgoyal2009/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2 zizmor: ignore[ref-version-mismatch]
        with:
          identifier: nektos.act
          installers-regex: '_Windows_\w+\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Chocolatey
        uses: ./.github/actions/choco # zizmor: ignore[self-repository]
        with:
          version: ${{ github.ref }}
          apiKey: ${{ secrets.CHOCO_APIKEY }}
          push: true
  gh-act:
    name: GitHub CLI extension
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      # promote only allows protected branches, so the app token is minted by
      # tag-gh-act.yml on master. This job waits so a tagging failure still fails the release.
      - name: Create gh-act tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref }}
        run: |
          set -euo pipefail
          # No checkout in this job, so gh needs GH_REPO. The dispatch API returns
          # the created run URL; watch that id instead of guessing from timestamps.
          run_url=$(gh workflow run tag-gh-act.yml --ref master -f tag="$TAG")
          run_id=$(printf '%s\n' "$run_url" | sed -n 's#.*/actions/runs/\([0-9][0-9]*\).*#\1#p' | head -n 1)
          if [ -z "${run_id}" ]; then
            echo "workflow dispatch did not return a run id: ${run_url}" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status
