name: release
on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Winget
        uses: vedantmgoyal2009/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: nektos.act
          installers-regex: '_Windows_\w+\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Chocolatey
        uses: ./.github/actions/choco
        with:
          version: ${{ github.ref }}
          apiKey: ${{ secrets.CHOCO_APIKEY }}
          push: true
  gh-act:
    name: GitHub CLI extension
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      # promote only allows protected branches, so the app token is minted by
      # tag-gh-act.yml on master. This job waits so a tagging failure still fails the release.
      - name: Create gh-act tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref }}
        run: |
          set -euo pipefail
          stamp=$(date -u -d '10 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run tag-gh-act.yml --ref master -f tag="$TAG"
          run_id=
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow=tag-gh-act.yml --event=workflow_dispatch --branch=master --limit=10 \
              --json databaseId,createdAt \
              --jq "map(select(.createdAt >= \"$stamp\")) | .[0].databaseId // empty")
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "${run_id}" ]; then
            echo "timed out waiting for the gh-act tag workflow to start" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status
