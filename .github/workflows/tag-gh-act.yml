name: tag gh-act
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Full ref to create on nektos/gh-act (refs/tags/v*)
        required: true
        type: string

permissions: {}

jobs:
  tag:
    name: GitHub CLI extension
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: promote
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID || secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nektos
          repositories: gh-act
          permission-contents: write
      - name: GitHub CLI extension
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TAG_REF: ${{ inputs.tag }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tagRef = process.env.TAG_REF;
            if (!/^refs\/tags\/v\d/.test(tagRef)) {
              core.setFailed('refusing to create a ref that is not a v* tag');
              return;
            }
            const mainRef = (await github.rest.git.getRef({
              owner: 'nektos',
              repo: 'gh-act',
              ref: 'heads/main',
            })).data;
            console.log(mainRef);
            await github.rest.git.createRef({
              owner: 'nektos',
              repo: 'gh-act',
              ref: tagRef,
              sha: mainRef.object.sha,
            });
