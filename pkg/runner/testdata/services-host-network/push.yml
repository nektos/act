name: services-host-network
on: push
jobs:
  services-host-network:
    runs-on: ubuntu-latest
    services:
      nginx:
        image: "nginx:latest"
        ports:
          - "8080:80"
    steps:
      # curl and netstat come from act-ci/bookworm-curl (see runner_test platforms).
      - run: netstat -tlpen
      - run: curl -v http://localhost:8080
